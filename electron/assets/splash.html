<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catnip Forge — 启动中</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei UI", sans-serif;
        background: transparent;
        --ink: #f7fbff;
        --ink-soft: #bed2f5;
        --cyan: #61d8ff;
        --blue: #2d7dff;
        --blue-bright: #69c8ff;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
      }

      body { padding: 10px; background: transparent; }

      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid rgba(112, 191, 255, 0.55);
        border-radius: 28px;
        background:
          radial-gradient(circle at 90% 82%, rgba(108, 72, 255, 0.48), transparent 34%),
          radial-gradient(circle at 78% 10%, rgba(19, 193, 255, 0.3), transparent 29%),
          radial-gradient(circle at 12% 112%, rgba(45, 125, 255, 0.34), transparent 42%),
          linear-gradient(142deg, #061844 0%, #08275f 48%, #111f5a 100%);
        box-shadow:
          0 30px 78px rgba(0, 6, 31, 0.52),
          0 0 34px rgba(45, 125, 255, 0.2),
          inset 0 1px 0 rgba(206, 238, 255, 0.24);
        opacity: 0;
        transform: translateY(5px) scale(0.992);
        animation: reveal 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .splash::before {
        content: "";
        position: absolute;
        width: 380px;
        height: 380px;
        right: -80px;
        top: -205px;
        border: 48px solid rgba(102, 204, 255, 0.08);
        border-radius: 50%;
        transform: rotate(-18deg);
        pointer-events: none;
      }

      .splash::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(98, 216, 255, 0.55) 0 1px, transparent 1.5px);
        background-position: 72px 142px, 176px 322px;
        background-size: 156px 149px, 213px 179px;
        opacity: 0.28;
      }

      .brandbar {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        height: 88px;
        padding: 18px 28px 14px;
        border-bottom: 1px solid rgba(136, 195, 255, 0.17);
        background: linear-gradient(90deg, rgba(2, 17, 55, 0.32), rgba(31, 72, 149, 0.08));
      }

      .brand { display: flex; align-items: center; gap: 13px; color: var(--ink); }

      .brand-mark {
        width: 50px;
        height: 50px;
        object-fit: contain;
        filter: drop-shadow(0 0 12px rgba(65, 155, 255, 0.46));
      }

      .brand-name {
        margin: 0;
        font-size: 27px;
        font-weight: 720;
        letter-spacing: -0.035em;
      }

      .brand-caption {
        margin-top: 3px;
        color: rgba(190, 218, 255, 0.72);
        font-size: 10px;
        font-weight: 720;
        letter-spacing: 0.13em;
      }

      .content {
        position: relative;
        z-index: 3;
        width: 58%;
        padding: 34px 0 0 38px;
        color: var(--ink);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--cyan);
        font-size: 11px;
        font-weight: 760;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 38px;
        font-weight: 740;
        line-height: 1.06;
        letter-spacing: -0.045em;
        text-shadow: 0 7px 25px rgba(0, 12, 44, 0.44);
      }

      .tagline-cn {
        margin: 15px 0 0;
        color: var(--ink-soft);
        font-size: 17px;
        font-weight: 540;
        letter-spacing: -0.02em;
      }

      .cat {
        position: absolute;
        z-index: 2;
        right: 12px;
        bottom: -5px;
        width: 302px;
        height: 302px;
        object-fit: contain;
        filter:
          drop-shadow(0 20px 23px rgba(0, 5, 33, 0.4))
          drop-shadow(0 0 15px rgba(83, 190, 255, 0.23));
        transform-origin: 62% 100%;
        animation: cat-arrive 560ms 90ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .progress-area {
        position: absolute;
        z-index: 4;
        left: 38px;
        bottom: 28px;
        width: calc(100% - 374px);
      }

      .progress-copy {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
        color: rgba(207, 226, 255, 0.82);
        font-size: 12px;
        font-weight: 650;
      }

      #progress-value {
        min-width: 34px;
        color: #ffffff;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .progress-track {
        height: 13px;
        overflow: hidden;
        border: 1px solid rgba(134, 205, 255, 0.28);
        border-radius: 999px;
        background: rgba(0, 12, 46, 0.64);
        box-shadow:
          inset 0 2px 5px rgba(0, 4, 24, 0.48),
          0 0 0 1px rgba(30, 112, 255, 0.08);
      }

      #progress-bar {
        position: relative;
        width: 8%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #206bff 0%, var(--blue) 46%, var(--blue-bright) 100%);
        box-shadow:
          0 0 16px rgba(45, 125, 255, 0.74),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        will-change: width;
      }

      #progress-bar::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 48px;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.78));
        animation: breathe 1.4s ease-in-out infinite;
      }

      @keyframes reveal {
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes cat-arrive {
        from { opacity: 0; transform: translate(18px, 15px) scale(0.95); }
        to { opacity: 1; transform: translate(0, 0) scale(1); }
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 0.9; }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash,
        .cat,
        #progress-bar,
        #progress-bar::after {
          animation: none;
          transition: none;
        }

        .splash { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Catnip Forge 正在启动">
      <header class="brandbar">
        <div class="brand">
          <img class="brand-mark" src="./icon.png" alt="" />
          <div>
            <p class="brand-name">Catnip Forge</p>
            <div class="brand-caption">CATNIP 硬件智能开发平台</div>
          </div>
        </div>
      </header>

      <section class="content">
        <p class="eyebrow">Autonomous Hardware Development Agent</p>
        <h1>One prompt.<br />Working hardware.</h1>
        <p class="tagline-cn">一句话，让硬件跑起来。</p>
      </section>

      <img class="cat" src="./splash-liukanshan.png" alt="刘看山" />

      <section class="progress-area" aria-live="polite">
        <div class="progress-copy">
          <span id="status">正在唤醒 Catnip Forge</span>
          <span id="progress-value">8%</span>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="8"
        >
          <div id="progress-bar"></div>
        </div>
      </section>
    </main>

    <script>
      const SPLASH_START_PROGRESS = 8;
      const SPLASH_WAIT_PROGRESS = 94;
      const SPLASH_DEFAULT_DURATION_MS = 5000;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const statusElement = document.getElementById('status');
      const progressValueElement = document.getElementById('progress-value');
      const progressBarElement = document.getElementById('progress-bar');
      const progressTrackElement = document.querySelector('.progress-track');
      let displayedProgress = SPLASH_START_PROGRESS;
      let timelineDurationMs = SPLASH_DEFAULT_DURATION_MS;
      let timelineFrame = 0;
      let timelineRunning = false;

      const renderProgress = (progress) => {
        displayedProgress = Math.max(0, Math.min(100, Number(progress) || 0));
        const rounded = Math.round(displayedProgress);
        progressValueElement.textContent = `${rounded}%`;
        progressBarElement.style.width = `${displayedProgress.toFixed(2)}%`;
        progressTrackElement.setAttribute('aria-valuenow', String(rounded));
      };

      const stopTimeline = () => {
        if (timelineFrame) cancelAnimationFrame(timelineFrame);
        timelineFrame = 0;
        timelineRunning = false;
      };

      window.setSplashStage = (status) => {
        statusElement.textContent = String(status || '正在启动');
      };

      window.startSplashTimeline = (durationMs = SPLASH_DEFAULT_DURATION_MS) => {
        stopTimeline();
        timelineDurationMs = Math.max(1, Number(durationMs) || SPLASH_DEFAULT_DURATION_MS);
        renderProgress(SPLASH_START_PROGRESS);

        if (reduceMotion) {
          renderProgress(SPLASH_WAIT_PROGRESS);
          return;
        }

        const startedAt = performance.now();
        timelineRunning = true;
        const advance = (now) => {
          const elapsedRatio = Math.min(1, (now - startedAt) / timelineDurationMs);
          renderProgress(
            SPLASH_START_PROGRESS + (SPLASH_WAIT_PROGRESS - SPLASH_START_PROGRESS) * elapsedRatio,
          );
          if (elapsedRatio < 1) timelineFrame = requestAnimationFrame(advance);
          else {
            timelineFrame = 0;
            timelineRunning = false;
          }
        };
        timelineFrame = requestAnimationFrame(advance);
      };

      window.completeSplashProgress = (status) => {
        window.setSplashStage(status || '准备就绪');
        stopTimeline();

        if (reduceMotion) {
          renderProgress(100);
          return;
        }

        const startProgress = displayedProgress;
        const startedAt = performance.now();
        const completionDurationMs = 180;
        timelineRunning = true;
        const finish = (now) => {
          const elapsedRatio = Math.min(1, (now - startedAt) / completionDurationMs);
          const easedRatio = 1 - Math.pow(1 - elapsedRatio, 3);
          renderProgress(startProgress + (100 - startProgress) * easedRatio);
          if (elapsedRatio < 1) timelineFrame = requestAnimationFrame(finish);
          else {
            timelineFrame = 0;
            timelineRunning = false;
          }
        };
        timelineFrame = requestAnimationFrame(finish);
      };

      window.forceSplashProgressForTest = (progress, status) => {
        stopTimeline();
        window.setSplashStage(status);
        renderProgress(progress);
      };

      window.getSplashProgressState = () => ({
        defaultDurationMs: SPLASH_DEFAULT_DURATION_MS,
        durationMs: timelineDurationMs,
        progress: displayedProgress,
        running: timelineRunning,
        reducedMotion: reduceMotion,
      });

      window.restartSplashTimelineForTest = (durationMs) => {
        window.startSplashTimeline(durationMs);
      };
    </script>
  </body>
</html>
